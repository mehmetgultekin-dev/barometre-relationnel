name: Check latest Python dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade streamlit pandas openpyxl streamlit-aggrid
      - run: python -m unittest discover -v
      - run: python -m compileall -q sitewebpython.py barometre_core.py test_barometre_core.py